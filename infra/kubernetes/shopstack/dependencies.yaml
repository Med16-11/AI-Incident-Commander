apiVersion: v1
kind: ConfigMap
metadata:
  name: shopstack-config
data:
  SHOPSTACK_DB_HOST: shopstack-postgres
  SHOPSTACK_DB_PORT: "5432"
  SHOPSTACK_DB_NAME: shopstack
  SHOPSTACK_DB_USER: shopstack
  SHOPSTACK_REDIS_URL: redis://shopstack-redis:6379/1
  SHOPSTACK_USER_SERVICE_URL: http://shopstack-user-service:8000
  SHOPSTACK_ORDER_SERVICE_URL: http://shopstack-order-service:8000
  SHOPSTACK_INVENTORY_SERVICE_URL: http://shopstack-inventory-service:8000
  SHOPSTACK_PAYMENT_SERVICE_URL: http://shopstack-payment-service:8000
  OTEL_EXPORTER_OTLP_ENDPOINT: http://shopstack-jaeger:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: shopstack-postgres
spec:
  selector: {app: shopstack-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shopstack-postgres
spec:
  serviceName: shopstack-postgres
  replicas: 1
  selector:
    matchLabels: {app: shopstack-postgres}
  template:
    metadata:
      labels: {app: shopstack-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: shopstack}
            - {name: POSTGRES_USER, value: shopstack}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: shopstack-db, key: password}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U shopstack -d shopstack"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: shopstack-redis
spec:
  selector: {app: shopstack-redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopstack-redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: shopstack-redis}
  template:
    metadata:
      labels: {app: shopstack-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shopstack-jaeger
spec:
  selector: {app: shopstack-jaeger}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: ui, port: 16686, targetPort: 16686}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopstack-jaeger
spec:
  replicas: 1
  selector:
    matchLabels: {app: shopstack-jaeger}
  template:
    metadata:
      labels: {app: shopstack-jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62
          env: [{name: COLLECTOR_OTLP_ENABLED, value: "true"}]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: ui, containerPort: 16686}
