apiVersion: v1
kind: Service
metadata:
  name: shopstack-api-gateway
spec:
  selector: {app: shopstack-api-gateway}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopstack-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: shopstack-api-gateway}
  template:
    metadata:
      labels: {app: shopstack-api-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api-gateway
          image: opsmind-shopstack:local
          imagePullPolicy: IfNotPresent
          command: [uvicorn, shopstack.main:app, --host, 0.0.0.0, --port, "8000"]
          envFrom: [{configMapRef: {name: shopstack-config}}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: SHOPSTACK_SERVICE, value: api-gateway}
            - name: SHOPSTACK_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: shopstack-db, key: password}}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1, memory: 512Mi}
---
