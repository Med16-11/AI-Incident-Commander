apiVersion: v1
kind: Namespace
metadata:
  name: opsmind-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsmind-remediation
  namespace: opsmind-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opsmind-remediation
  namespace: shopstack
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opsmind-remediation
  namespace: shopstack
subjects:
  - kind: ServiceAccount
    name: opsmind-remediation
    namespace: opsmind-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opsmind-remediation
