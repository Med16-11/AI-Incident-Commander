apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: opsmind-api}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: opsmind-api}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: opsmind-incident-engine}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: opsmind-incident-engine}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
