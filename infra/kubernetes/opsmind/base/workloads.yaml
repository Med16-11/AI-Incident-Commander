apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmind-api
  labels: {app.kubernetes.io/part-of: opsmind, app.kubernetes.io/component: api}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: opsmind-api}}
  template:
    metadata:
      annotations: {opsmind.io/release-id: "${OPSMIND_RELEASE_ID}"}
      labels: {app.kubernetes.io/part-of: opsmind, app.kubernetes.io/component: api, app.kubernetes.io/name: opsmind-api}
    spec:
      serviceAccountName: opsmind-app
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ${OPSMIND_IMAGE}
          imagePullPolicy: IfNotPresent
          command: [uvicorn, opsmind_api.main:app, --host, 0.0.0.0, --port, "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: opsmind-config}}]
          env:
            - {name: OPSMIND_DATABASE_URL, valueFrom: {secretKeyRef: {name: opsmind-runtime, key: OPSMIND_DATABASE_URL}}}
            - {name: OPSMIND_LOCAL_DEMO_TOKEN, valueFrom: {secretKeyRef: {name: opsmind-runtime, key: OPSMIND_LOCAL_DEMO_TOKEN, optional: true}}}
            - {name: OPSMIND_REDIS_URL, valueFrom: {secretKeyRef: {name: opsmind-runtime, key: OPSMIND_REDIS_URL}}}
            - {name: OPSMIND_OTEL_EXPORTER_OTLP_ENDPOINT, valueFrom: {secretKeyRef: {name: opsmind-runtime, key: OPSMIND_OTEL_EXPORTER_OTLP_ENDPOINT}}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /health/live, port: http}, failureThreshold: 30, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10, timeoutSeconds: 2}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 2}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 768Mi}}
---
