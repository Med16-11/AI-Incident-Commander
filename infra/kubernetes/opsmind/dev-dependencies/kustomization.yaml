apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - stateful-services.yaml
  - telemetry.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: loki-config
    files:
      - loki.yaml
  - name: otel-config
    files:
      - otel-collector.yaml
generatorOptions:
  disableNameSuffixHash: true
