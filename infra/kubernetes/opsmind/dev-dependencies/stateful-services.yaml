apiVersion: v1
kind: Service
metadata: {name: opsmind-postgres, labels: {app.kubernetes.io/part-of: opsmind, app.kubernetes.io/component: database}}
spec:
  selector: {app.kubernetes.io/name: opsmind-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: opsmind-postgres}
spec:
  serviceName: opsmind-postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: opsmind-postgres}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: opsmind, app.kubernetes.io/component: database, app.kubernetes.io/name: opsmind-postgres}
    spec:
      serviceAccountName: opsmind-app
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: opsmind}
            - {name: POSTGRES_USER, value: opsmind}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: opsmind-runtime, key: POSTGRES_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          startupProbe: {exec: {command: [pg_isready, -U, opsmind, -d, opsmind]}, failureThreshold: 30, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, opsmind, -d, opsmind]}, periodSeconds: 10}
          readinessProbe: {exec: {command: [pg_isready, -U, opsmind, -d, opsmind]}, periodSeconds: 5}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, labels: {app.kubernetes.io/part-of: opsmind, app.kubernetes.io/component: redis}}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: opsmind, app.kubernetes.io/component: redis, app.kubernetes.io/name: redis}
    spec:
      serviceAccountName: opsmind-app
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --save, "", --appendonly, "no"]
          ports: [{name: redis, containerPort: 6379}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          startupProbe: {exec: {command: [redis-cli, ping]}, failureThreshold: 30, periodSeconds: 5}
          livenessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 10}
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
