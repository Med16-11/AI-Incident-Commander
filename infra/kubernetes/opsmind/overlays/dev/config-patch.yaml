apiVersion: v1
kind: ConfigMap
metadata: {name: opsmind-config}
data:
  OPSMIND_ENVIRONMENT: dev
  OPSMIND_DETECTION_PROMETHEUS_JOB_REGEX: shopstack
  OPSMIND_LOCAL_DEMO_AUTH_ENABLED: "true"
  OPSMIND_LOG_LEVEL: DEBUG
  OPSMIND_KUBERNETES_NAMESPACE: "${OPSMIND_TARGET_NAMESPACE}"
  OPSMIND_DETECTION_POLL_INTERVAL_SECONDS: "30"
