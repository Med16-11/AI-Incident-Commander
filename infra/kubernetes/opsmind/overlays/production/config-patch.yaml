apiVersion: v1
kind: ConfigMap
metadata: {name: opsmind-config}
data:
  OPSMIND_ENVIRONMENT: production
  OPSMIND_LOG_LEVEL: INFO
  OPSMIND_KUBERNETES_NAMESPACE: "${OPSMIND_TARGET_NAMESPACE}"
  OPSMIND_DETECTION_POLL_INTERVAL_SECONDS: "15"
  OPSMIND_INVESTIGATION_MAX_EXECUTION_SECONDS: "180"
  OPSMIND_OTEL_EXPORTER_OTLP_INSECURE: "false"
