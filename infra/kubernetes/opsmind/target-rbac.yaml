apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opsmind-remediation
  namespace: ${OPSMIND_TARGET_NAMESPACE}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opsmind-remediation
  namespace: ${OPSMIND_TARGET_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: opsmind-remediation
    namespace: ${OPSMIND_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opsmind-remediation
