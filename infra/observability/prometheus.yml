global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: opsmind
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000, incident-engine:8000, detection-engine:8000, remediation-engine:8000, notification-service:8000, worker:8000, event-ingestion:8000]
  - job_name: shopstack
    metrics_path: /metrics
    static_configs:
      - targets: [shopstack-api-gateway:8000, shopstack-order-service:8000, shopstack-inventory-service:8000, shopstack-payment-service:8000, shopstack-user-service:8000]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: [cadvisor:8080]
